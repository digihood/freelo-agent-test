<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontaktní formulář</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input.error,
        textarea.error {
            border-color: #e74c3c;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .success-message {
            background: #2ecc71;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
            margin-top: 20px;
            animation: slideIn 0.3s ease;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .char-count {
            font-size: 12px;
            color: #999;
            text-align: right;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kontaktní formulář</h1>
        <p class="subtitle">Vyplňte prosím všechna pole a my se vám ozveme</p>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">Jméno a příjmení *</label>
                <input type="text" id="name" name="name" placeholder="Jan Novák">
                <div class="error-message" id="nameError">Prosím vyplňte své jméno</div>
            </div>

            <div class="form-group">
                <label for="email">E-mail *</label>
                <input type="email" id="email" name="email" placeholder="jan.novak@email.cz">
                <div class="error-message" id="emailError">Prosím zadejte platnou e-mailovou adresu</div>
            </div>

            <div class="form-group">
                <label for="message">Zpráva *</label>
                <textarea id="message" name="message" placeholder="Vaše zpráva..."></textarea>
                <div class="char-count">
                    <span id="charCount">0</span> / 500 znaků
                </div>
                <div class="error-message" id="messageError">Zpráva musí obsahovat alespoň 10 znaků</div>
            </div>

            <button type="submit" id="submit">Odeslat zprávu</button>
        </form>

        <div class="success-message" id="successMessage">
            ✓ Zpráva byla úspěšně odeslána! Děkujeme za váš zájem.
        </div>
    </div>

    <script>
        // Počítadlo znaků
        const messageField = document.getElementById('message');
        const charCount = document.getElementById('charCount');

        messageField.addEventListener('input', function() {
            const count = this.value.length;
            charCount.textContent = count;

            if (count > 500) {
                this.value = this.value.substring(0, 500);
                charCount.textContent = 500;
            }
        });

        // Validační funkce
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function showError(fieldId, errorId, message) {
            const field = document.getElementById(fieldId);
            const error = document.getElementById(errorId);

            field.classList.add('error');
            error.textContent = message;
            error.classList.add('show');
        }

        function clearError(fieldId, errorId) {
            const field = document.getElementById(fieldId);
            const error = document.getElementById(errorId);

            field.classList.remove('error');
            error.classList.remove('show');
        }

        function clearAllErrors() {
            clearError('name', 'nameError');
            clearError('email', 'emailError');
            clearError('message', 'messageError');
        }

        // Real-time validace při psaní
        document.getElementById('name').addEventListener('input', function() {
            if (this.value.trim().length > 0) {
                clearError('name', 'nameError');
            }
        });

        document.getElementById('email').addEventListener('input', function() {
            if (validateEmail(this.value)) {
                clearError('email', 'emailError');
            }
        });

        document.getElementById('message').addEventListener('input', function() {
            if (this.value.trim().length >= 10) {
                clearError('message', 'messageError');
            }
        });

        // Odeslání formuláře
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();

            clearAllErrors();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();

            let isValid = true;

            // Validace jména
            if (name.length === 0) {
                showError('name', 'nameError', 'Prosím vyplňte své jméno');
                isValid = false;
            } else if (name.length < 2) {
                showError('name', 'nameError', 'Jméno musí obsahovat alespoň 2 znaky');
                isValid = false;
            }

            // Validace emailu
            if (email.length === 0) {
                showError('email', 'emailError', 'Prosím zadejte e-mailovou adresu');
                isValid = false;
            } else if (!validateEmail(email)) {
                showError('email', 'emailError', 'Prosím zadejte platnou e-mailovou adresu');
                isValid = false;
            }

            // Validace zprávy
            if (message.length === 0) {
                showError('message', 'messageError', 'Prosím vyplňte zprávu');
                isValid = false;
            } else if (message.length < 10) {
                showError('message', 'messageError', 'Zpráva musí obsahovat alespoň 10 znaků');
                isValid = false;
            }

            // Pokud je vše validní, zobraz úspěšnou zprávu
            if (isValid) {
                console.log('Formulář odeslán:', { name, email, message });

                // Zobrazení úspěšné zprávy
                document.getElementById('successMessage').classList.add('show');

                // Reset formuláře
                this.reset();
                charCount.textContent = '0';

                // Skrytí zprávy po 5 sekundách
                setTimeout(() => {
                    document.getElementById('successMessage').classList.remove('show');
                }, 5000);
            }
        });
    </script>
</body>
</html>
